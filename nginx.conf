limit_req_zone $binary_remote_addr zone=workspaces_limit:10m rate=20r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sin query string: el accessToken viaja en la URL y no debe quedar en los logs.
map $request_uri $request_path {
    ~^(?<path_only>[^?]*) $path_only;
}
log_format workspace '$remote_addr [$time_local] "$request_method $request_path" $status $body_bytes_sent';

server {
    listen 80;
    server_name 192.168.1.10;

    location /api/workspaces/ {
        limit_req zone=workspaces_limit burst=2;

        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Opcional para desarrollo local: aumenta el tiempo de espera por si Docker tarda en responder
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }


    location /api/ {
        proxy_pass http://localhost:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Escritorios: /workspace/<uuid>/?accessToken=<JWT>
    location ~ "^/workspace/(?<ws_id>[0-9a-f-]{36})/" {
        access_log /var/log/nginx/workspace.log workspace;
        error_log /var/log/nginx/workspace-error.log crit; # los errores de upstream registran la query

        # Debe ir antes del rewrite: este sobrescribe las capturas de la location.
        set $ws_uuid $ws_id;

        # Canje del accessToken por la cookie ws_session (el token nunca llega al contenedor).
        if ($arg_accessToken) {
            rewrite ^ /_ws_session last;
        }

        auth_request /_ws_auth;
        auth_request_set $ws_port $upstream_http_x_workspace_port;
        auth_request_set $ws_auth $upstream_http_x_workspace_authorization;

        rewrite ^/workspace/[^/]+/(.*)$ /$1 break;

        proxy_pass https://127.0.0.1:$ws_port;
        proxy_ssl_verify off; # certificado autofirmado de KasmVNC
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $ws_auth;
        proxy_set_header Cookie ""; # ws_session no debe llegar al contenedor
        proxy_redirect ~^https://127\.0\.0\.1:\d+/(.*)$ /workspace/$ws_uuid/$1;
        proxy_redirect ~^/(.*)$ /workspace/$ws_uuid/$1;
        proxy_read_timeout 3600s;

        # El contenido del contenedor solo puede conectarse a /workspace/ (no a /api/*).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; connect-src $scheme://$http_host/workspace/ ws://$http_host/workspace/; form-action $scheme://$http_host/workspace/; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # Solo accesibles por redirección interna de nginx (externamente responden 404).
    location = /_ws_auth {
        internal;
        access_log off;

        proxy_pass http://localhost:8000/internal/workspace-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /_ws_session {
        internal;
        access_log /var/log/nginx/workspace.log workspace;
        error_log /var/log/nginx/workspace-error.log crit; # los errores de upstream registran la query

        rewrite ^ /internal/workspace-session? break; # descarta la query (accessToken)
        proxy_pass http://localhost:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header X-Original-URI $request_uri;
    }
}