server {
    listen 80;
    server_name 192.168.1.10;

    location /api/ {
        proxy_pass http://localhost:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # location ~ ^/proxy/workspaces/(?<workspace_id>[^/]+)/(?<rest>.*)$ {
    #     # Validar sesión delegando al API Express
    #     auth_request /auth-verify;

    #     # Opcional: Redirigir a login si falla la validación
    #     error_page 401 = /login;
    #     # Configuración obligatoria para WebSockets (requerido por KasmVNC)
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 86400; # Evita que la sesión se desconecte rápido
    #     # RESOLUCIÓN DEL CONTENEDOR DINÁMICO
    #     # NGINX usará el DNS interno de Docker para encontrar el contenedor por nombre
    #     resolver 127.0.0.11 valid=30s;
    #     # Asume que nombras tus contenedores como "workspace-{id}"
    #     # y que el puerto interno de KasmVNC es el 6901
    #     set $upstream_workspace workspace-$workspace_id:6901;
    #     proxy_pass https://$upstream_workspace/$rest$is_args$args;
    # }
    location /proxy/test/ {
        auth_request /auth-verify;

        auth_request_set $workspace_auth $upstream_http_x_workspace_auth;

        # 2. Configuración obligatoria para WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;

        # 3. Ignorar el certificado auto-firmado de KasmVNC
        proxy_ssl_verify off;
        proxy_set_header Authorization $workspace_auth;

        # 4. Enrutamiento directo al contenedor
        proxy_pass https://192.168.1.10:6901/;
    }

    location = /auth-verify {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/verify; # Tu endpoint de validación
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
}