map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /var/www/cloudlab/frontend/dist;
    index index.html;

    error_page 404 /404.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Origin $http_origin;
    }

    location ~ "^/workspace/(?<extracted_uuid>[0-9a-f-]{36})(?<workspace_path>/.*)$" {
        set $workspace_id $extracted_uuid;
        auth_request /_auth_workspace;

        error_page 401 = /login;

        rewrite ^/workspace/[^/]+/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        #proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        proxy_ssl_verify off;

        proxy_pass https://127.0.0.1:41848;
    }

    location = /_auth_workspace {
        internal;
        proxy_pass http://127.0.0.1:8000/api/internal/workspace-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Pasar credenciales del cliente original al validador
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}