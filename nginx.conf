limit_req_zone $binary_remote_addr zone=workspaces_limit:10m rate=20r/m;

server {
    listen 80;
    server_name 192.168.1.10;

    location /api/workspaces/ {
        limit_req zone=workspaces_limit burst=2;

        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Opcional para desarrollo local: aumenta el tiempo de espera por si Docker tarda en responder
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }


    location /api/ {
        proxy_pass http://localhost:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}